services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: coldy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - coldy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: coldy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - coldy_redisdata:/data

  minio:
    image: minio/minio:latest
    container_name: coldy-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - coldy_miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  backend-1:
    image: oven/bun:1-alpine
    container_name: coldy-backend-1
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    env_file:
      - ./.env
    environment:
      INSTANCE_ID: backend-1
    volumes:
      - .:/app
    command: sh -lc "bun install && bun run dev"
    restart: unless-stopped
    # Pas de "ports" exposé côté host : seul nginx parle aux backends

  backend-2:
    image: oven/bun:1-alpine
    container_name: coldy-backend-2
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    env_file:
      - ./.env
    environment:
      INSTANCE_ID: backend-2
    volumes:
      - .:/app
    command: sh -lc "bun install && bun run dev"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: coldy-nginx
    restart: unless-stopped
    depends_on:
      - backend-1
      - backend-2
    ports:
      - "3001:80"   # <- seul port exposé au VPS/nginx global
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  coldy_pgdata:
  coldy_redisdata:
  coldy_miniodata: